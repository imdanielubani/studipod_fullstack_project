<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1d54" />
    <meta name="robots" content="noindex" />
    <title>You are offline · Studipod</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!--
      Offline fallback served by the service worker when a page cannot be reached.
      Self-contained on purpose: no scripts and no external styles, so it renders from
      the precache alone. Keep it free of candidate data.
    -->
    <style>
      :root {
        color-scheme: light;
        --navy: #0a1d54;
        --blue: #1c61f7;
        --muted: #55607f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--navy);
        background: #ffffff;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: 8px;
        background: var(--blue);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        Studipod needs an internet connection for messaging, matching, bookings and video sessions.
        Check your connection, then try again.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
