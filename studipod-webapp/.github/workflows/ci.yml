# Candidate Webapp validation.
#
# GitHub only runs workflows from the repository root's .github folder. This workflow is
# active when studipod-webapp is its own repository; while it lives inside the
# studipod_fullstack_project repository it is inactive and serves as the reference
# pipeline (copy it to the root .github/workflows with `working-directory` set to
# studipod-webapp to enable it there).

name: Webapp CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
  NEXT_PUBLIC_WS_URL: ws://localhost:3001
  NEXT_PUBLIC_LIVEKIT_URL: wss://ci.livekit.invalid

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Switch to `pnpm test:coverage` (80% threshold) when the first feature tests land;
      # with no tests yet, coverage of the scaffold is 0% by definition.
      - run: pnpm test
      - run: pnpm build
      - name: Service worker was generated
        run: test -s public/sw.js
      - run: pnpm audit --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: >
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
          --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          --build-arg NEXT_PUBLIC_WS_URL=$NEXT_PUBLIC_WS_URL
          --build-arg NEXT_PUBLIC_LIVEKIT_URL=$NEXT_PUBLIC_LIVEKIT_URL
          -t studipod-webapp:ci .
