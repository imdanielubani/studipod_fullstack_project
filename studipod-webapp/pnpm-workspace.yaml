# pnpm settings for the candidate webapp (pnpm 12 reads these from this file, not .npmrc).
# The webapp is a single package, so no workspace members are listed.

# Refuse installs on unsupported Node.js versions (see "engines" in package.json).
engineStrict: true
autoInstallPeers: true

# Dependency install scripts are blocked unless listed here.
# true  = allowed (native addons that need to build or fetch a binary)
# false = reviewed and denied (telemetry or non-essential postinstall scripts)
allowBuilds:
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  # Pulled in by next-intl's optional message extractor; both ship prebuilt binaries.
  '@swc/core': false
  '@parcel/watcher': false
  # Bundles the service worker; the platform binary arrives as an optional dependency.
  esbuild: false
# Versions shared with the admin dashboard that were newer than the release-age window.
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.9'
  - lucide-react@1.79.0
