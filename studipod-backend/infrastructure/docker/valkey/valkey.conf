# Valkey configuration for Studipod (cache, BullMQ queues, Socket.IO adapter, pub/sub).
# The password (requirepass) is supplied on stdin at start-up from REDIS_PASSWORD, never stored here.

# Listen on the container interface; the port is never published publicly.
bind 0.0.0.0
protected-mode yes
port 6379

# BullMQ requires that keys are never evicted. Size the container memory limit
# and maxmemory together; if a separate cache instance is added later, give it
# allkeys-lru instead.
maxmemory 512mb
maxmemory-policy noeviction

# Durability: append-only file with per-second fsync, plus periodic snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 100

# Disable commands that should never be issued by the application.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
# CONFIG stays available: BullMQ and monitoring read maxmemory-policy through it.

timeout 0
tcp-keepalive 300
loglevel notice
