# Admin Dashboard validation.
#
# GitHub only runs workflows from the repository root's .github folder. This workflow
# is active when studipod-admin-dashboard is its own repository; while it lives inside
# the studipod_fullstack_project monorepo it is inactive and serves as the reference
# pipeline (copy it to the root .github/workflows with `working-directory` set to
# studipod-admin-dashboard to enable it there).

name: Admin Dashboard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm audit

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: >
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3100
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
          --build-arg NEXT_PUBLIC_WS_URL=ws://localhost:3001
          -t studipod-admin-dashboard:ci .
