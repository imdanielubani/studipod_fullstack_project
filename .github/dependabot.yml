version: 2
updates:
  - package-ecosystem: npm
    directory: /studipod-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: docker
    directory: /studipod-backend
    schedule:
      interval: weekly
    labels: [dependencies, backend, docker]

  - package-ecosystem: docker-compose
    directories:
      - /studipod-backend
      - /studipod-backend/infrastructure/dokploy
    schedule:
      interval: weekly
    labels: [dependencies, backend, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
