# StudiPod website — continuous integration.
# The Next.js app lives in ./studipod_website; every job runs from there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: studipod_website

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: http://localhost:3200
  # Ephemeral CI service database only (see the postgres services below).
  DATABASE_URL: postgresql://studipod:studipod_ci@localhost:5432/studipod?schema=public

jobs:
  quality:
    name: Format, lint, types & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studipod_website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studipod
          POSTGRES_PASSWORD: studipod_ci
          POSTGRES_DB: studipod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studipod -d studipod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studipod_website/package-lock.json
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Run tests with coverage (80% threshold)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: studipod_website/coverage
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studipod
          POSTGRES_PASSWORD: studipod_ci
          POSTGRES_DB: studipod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studipod -d studipod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studipod_website/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - run: npm run build
      - name: Run Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: studipod_website/playwright-report
          retention-days: 14
