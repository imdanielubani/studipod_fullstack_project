# Studipod backend: continuous integration.
# Runs only when the backend, the shared packages or the workspace configuration change.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - studipod-backend/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - studipod-backend/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: studipod-backend

jobs:
  quality:
    name: Format, lint, types, Prisma & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Environment file check
        run: bash infrastructure/scripts/check-env-files.sh
      - run: pnpm run format:check
      - run: pnpm run prisma:validate
      - run: pnpm run prisma:generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: studipod
          POSTGRES_PASSWORD: studipod_ci
          POSTGRES_DB: studipod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studipod -d studipod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      # Ephemeral CI service containers only; not real credentials.
      DATABASE_URL: postgresql://studipod:studipod_ci@localhost:5432/studipod?schema=public
      DIRECT_DATABASE_URL: postgresql://studipod:studipod_ci@localhost:5432/studipod?schema=public
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate
      - name: Apply migrations
        run: pnpm run prisma:migrate:deploy
      # Switch to `pnpm run test:cov` (80% threshold) once the first tests exist.
      - run: pnpm run test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (fail on high or critical)
        run: pnpm audit --audit-level=high

  image:
    name: Docker image build & scan
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: studipod-backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: studipod-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studipod-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
